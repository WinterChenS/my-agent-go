# Anvil Rust + Tauri workspace root.
#
# Scope note: R0-RS01 added the shared D: path contract, R0-RS02 added the
# Tauri v2 desktop host (`src-tauri/`, package `anvil`), R0-RS03 adds the Rust
# verification/gate CLI (`tools/devtools/`, package `anvil-devtools`).
# Every build must use `Cargo.lock` (`--locked`) and a D: target directory
# (`.cargo/config.toml`, overridable through `CARGO_TARGET_DIR`).
[workspace]
resolver = "3"
members = ["crates/anvil-paths", "crates/anvil-catalog", "src-tauri", "tools/devtools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
windows-sys = { version = "0.61", default-features = false }
