# 六目标真实 runner 验证。
#
# 为什么需要它：本地只有一台 Windows 10 / amd64 机器，RPC05（进程树回收）、
# 分帧、worker 关闭时序里的 Unix 分支在本地一次都跑不到。用真实 runner 跑，
# 才算真的验证过，而不是"没有机器所以跳过"。
#
# 每个 target 跑：build → vet → test → race → checkptr → 交叉编译。
# -race 在 CI 上可用（runner 自带 gcc/clang），本机缺编译器时由这里补上竞态验证；
# win-arm64 的工具链不支持 -race，改用 checkptr 作补充证据（明确不替代竞态检测）。

name: verify

# 触发策略（成本控制）：
#   - 只有 main 分支的 push 自动构建。日常开发走 feature 分支，推送不消耗 CI 分钟。
#   - 去掉 pull_request 触发：每次 PR 同步都会跑满六个目标，代价远高于收益。
#   - 需要验证 feature 分支时手动 Run workflow（workflow_dispatch 可选分支）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-matrix:
    name: go / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # 失败即红：runner 已全部为可用的真实机器，不再用 continue-on-error 掩盖真实失败。
    # （2026-11-03 首轮曾把 win-arm64 / mac-x64 设为 experimental，结果是"红也不算数"，
    #   与"PASS 由证据确定"的口径冲突。）
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025,     target: win-x64,     goos: windows, goarch: amd64 }
          - { os: windows-11-arm,   target: win-arm64,   goos: windows, goarch: arm64 }
          - { os: macos-15-intel,   target: mac-x64,     goos: darwin,  goarch: amd64 }
          - { os: macos-15,         target: mac-arm64,   goos: darwin,  goarch: arm64 }
          - { os: ubuntu-24.04,     target: linux-x64,   goos: linux,   goarch: amd64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64, goos: linux,   goarch: arm64 }
    env:
      # 与 go.mod / versions.lock.json 保持一致；setup-go 直接读 go.mod。
      CGO_ENABLED: "1"
      # 六个目标都必须真正跑通"OS 保护存储读写"（SEC07），
      # 后端不可用即判红——装了后端还不可用说明是配置或实现问题，不许 skip 成绿。
      MYAGENT_REQUIRE_NATIVE_CREDSTORE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 记录实际工具链
        shell: bash
        run: |
          echo "go      = $(go version)"
          echo "GOOS    = $(go env GOOS)"
          echo "GOARCH  = $(go env GOARCH)"
          echo "CC      = $(go env CC)"
          echo "os      = ${{ matrix.os }}"

      - name: 断言 runner 架构与目标矩阵一致
        shell: bash
        run: |
          got="$(go env GOOS)/$(go env GOARCH)"
          want="${{ matrix.goos }}/${{ matrix.goarch }}"
          if [ "$got" != "$want" ]; then
            echo "::error::runner 实际架构 $got 与目标 $want 不一致，该结果不可用作 ${{ matrix.target }} 证据"
            exit 2
          fi

      - name: 准备前端产物占位（仅为让 go build ./... 通过）
        # cmd/myagent 用 //go:embed 把 frontend/dist 打进二进制，go:embed 要求目录非空。
        # 这里只放一个占位 index.html，目的是让六目标的编译/vet 跑得起来——
        # **它不代表前端产物被验证过**：真实构建与类型检查由独立的 frontend job 负责，
        # 打包产物的验收（PKG01–PKG07）在 G4 之后才做。
        shell: bash
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            mkdir -p frontend/dist
            printf '<!doctype html><title>placeholder</title>\n' > frontend/dist/index.html
            echo "已写入占位 dist（CI 不验证前端产物）"
          else
            echo "frontend/dist 已存在"
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: 准备 Secret Service（Linux）
        # SEC07 在 Linux 上走 libsecret/Secret Service。runner 默认没有 keyring daemon，
        # 必须自己起一个：不装就等于"这一目标没有凭证后端"，SEC07 只能 BLOCKED。
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring libsecret-tools dbus-x11
          command -v secret-tool

      - name: test
        # 统一经由 with-keyring.sh：Linux 上它会开 D-Bus session 并解锁 keyring。
        # 不能只在某一步做——job 级 MYAGENT_REQUIRE_NATIVE_CREDSTORE=1 对所有步骤生效。
        shell: bash
        run: bash scripts/ci/with-keyring.sh go test ./... -count=1 -timeout 600s

      - name: race
        # 竞态验证。两类"不通过"要分开处理，不能混成一种绿色：
        #   1) Go 工具链本身不支持该 GOOS/GOARCH 的 -race（如 windows/arm64）→ 记 BLOCKED，
        #      明确写进 job summary，不得声明已通过；
        #   2) runner 缺 C 编译器 → 可修复的环境问题，直接判红。
        shell: bash
        run: |
          pair="$(go env GOOS)/$(go env GOARCH)"
          race_supported=""
          case "$pair" in
            linux/amd64|linux/arm64|linux/arm|linux/386|linux/ppc64le|linux/s390x|linux/riscv64|linux/loong64) race_supported=1 ;;
            darwin/amd64|darwin/arm64) race_supported=1 ;;
            windows/amd64) race_supported=1 ;;
            freebsd/amd64|freebsd/arm64|netbsd/amd64|netbsd/arm64) race_supported=1 ;;
          esac
          if [ -z "$race_supported" ]; then
            # 工具链不支持 -race 的目标：跑 checkptr 作为**补充**证据。
            # checkptr 能抓出 unsafe.Pointer 误用（process_windows.go 正是靠 unsafe 调
            # Job Object API），但**不能**替代数据竞争检测——两者查的是不同的东西。
            bash scripts/ci/with-keyring.sh go test -gcflags=all=-d=checkptr=2 ./internal/... -count=1 -timeout 900s
            echo "::warning title=-race 不支持该目标::Go 工具链不支持 $pair 的 -race；${{ matrix.target }} 竞态验证记为 BLOCKED"
            {
              echo "### ${{ matrix.target }}"
              echo ""
              echo "| 检查 | 结果 | 说明 |"
              echo "|---|---|---|"
              echo "| -race | **BLOCKED** | Go 工具链不支持 \`$pair\` 的 -race；该目标不得声明已过竞态验证 |"
              echo "| checkptr | **PASS** | \`-d=checkptr=2\`，覆盖 unsafe.Pointer 误用；不替代竞态检测 |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cc="$(go env CC | awk '{print $1}')"
          if ! command -v "$cc" >/dev/null 2>&1; then
            echo "::error::runner 无 C 编译器（CC=$cc），-race 无法执行；${{ matrix.target }} 不得声明已过竞态验证"
            exit 2
          fi
          bash scripts/ci/with-keyring.sh go test -race ./internal/... -count=1 -timeout 900s
          bash scripts/ci/with-keyring.sh go test -gcflags=all=-d=checkptr=2 ./internal/... -count=1 -timeout 900s
          {
            echo "### ${{ matrix.target }}"
            echo ""
            echo "| 检查 | 结果 | 说明 |"
            echo "|---|---|---|"
            echo "| -race | **PASS** | \`$pair\`，CC=$cc |"
            echo "| checkptr | **PASS** | \`-d=checkptr=2\`，覆盖 unsafe.Pointer 误用 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 交叉编译到其余目标（只验证可编译，不冒充运行验证）
        shell: bash
        run: |
          set -e
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${t%%/*}"; arch="${t##*/}"
            if [ "$os/$arch" = "${{ matrix.goos }}/${{ matrix.goarch }}" ]; then continue; fi
            echo "--- cross build $os/$arch ---"
            # 不能带 -o：./... 是多包，-o 只接受单个包或目录，会报
            # "cannot write multiple packages to non-directory"。
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build ./...
          done

  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 build/versions.lock.json 一致
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 断言 node/npm 版本
        run: |
          node -v
          npm -v
          test "$(node -v)" = "v24.16.0" || { echo "::error::node 版本与基线不一致"; exit 2; }

      - working-directory: frontend
        run: npm ci

      - working-directory: frontend
        run: npm run typecheck

      - working-directory: frontend
        run: npm run build
