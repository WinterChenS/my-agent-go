name: Build installers

# Cutting a tag is the release decision: pushes to main build nothing, so a
# half-finished change on main can never silently become an update everyone
# receives. Tag as `anvil-v<version>` — the version must equal the one in
# tauri.conf.json, checked before any build starts.
#
# The four builds upload to ONE draft release named after the tag, because the
# updater manifest (`latest.json`) is a single file that the action merges per
# platform as each build finishes — four separate releases would mean four
# manifests that each know one platform.
#
# A draft is not visible to the updater: `releases/latest/download/latest.json`
# only resolves once the final job has checked that the manifest lists every
# platform and published the draft. A half-filled release is therefore never
# announced.
on:
  push:
    tags: ['anvil-v*']

permissions:
  contents: write

# The checked-in .cargo/config.toml pins an absolute Windows path for local
# builds. CI must override it or the runner tries to create a directory named
# "D:" relative to the checkout.
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # A tag is the release decision, so it must name exactly the build this
      # checkout produces. Without this, `anvil-v0.1.19` on a 0.1.18 checkout
      # would publish 0.1.18 binaries under a version that lies to the updater.
      - name: Check the tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          expected="anvil-v${VERSION}"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::tag is '$TAG' but tauri.conf.json says $VERSION (expected '$expected')"
            exit 1
          fi
          echo "tagged release $TAG"

  build:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            pi_target: win-x64
            bundles: msi,nsis
            args: ""
          - name: macos-arm64
            platform: macos-latest
            pi_target: mac-arm64
            bundles: dmg,app
            args: --target aarch64-apple-darwin
          - name: macos-x64
            platform: macos-latest
            pi_target: mac-x64
            bundles: dmg,app
            args: --target x86_64-apple-darwin
          - name: linux-x64
            platform: ubuntu-22.04
            pi_target: linux-x64
            bundles: deb,appimage,rpm
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The toolchain action does not reliably install both macOS targets from
      # a comma-separated expression on an arm64 runner. Do it explicitly.
      - name: Install macOS cross targets
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ADR 0009: the installer carries Pi and the Node that runs it. Staging
      # happens before the Tauri build because `bundle.resources` maps this
      # directory into the install. A wrong-architecture Node, a missing CLI or
      # a missing sub-agent example fails here, which stops this platform
      # instead of publishing an installer that can be installed but never run.
      - name: Build the bundling tool
        run: cargo build --locked -p anvil-devtools

      - name: Stage the bundled Pi runtime
        shell: bash
        run: |
          set -euo pipefail
          bin=target/debug/anvil-devtools
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          "$bin" bundle-pi --target=${{ matrix.pi_target }}
          # Re-read what was just written: the release publishes this tree, and
          # a tree that fails its own manifest check must not reach an installer.
          "$bin" bundle-pi --target=${{ matrix.pi_target }} --check-only

      - name: Build platform installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater refuses a bundle whose signature it cannot verify, so
          # every bundle is signed with the release key. Only the public half is
          # in tauri.conf.json; the private half lives in the repository secret
          # and never reaches the checkout.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: Anvil ${{ needs.verify.outputs.version }}
          releaseBody: |
            ### macOS

            The app is ad-hoc signed, not notarized (that needs a paid Apple
            Developer ID). If macOS says the app "is damaged" or cannot be
            verified, clear the download quarantine once after installing:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Anvil.app
            ```

            On Apple Silicon use the `aarch64` DMG; the `x64` DMG runs under
            Rosetta and is only for Intel Macs.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          # Four jobs merge into one `latest.json`. A retry re-reads the release
          # file before merging, so a job that lost a race adds its platform to
          # the winner's list instead of replacing it.
          retryAttempts: 3
          # The Pi runtime mapping lives in an overlay config so a clean
          # checkout can still run `cargo test` without the staged tree.
          args: --config tauri.bundle.conf.json --bundles ${{ matrix.bundles }} ${{ matrix.args }}
          uploadUpdaterJson: true
          # NSIS (setup.exe) is the bundle the updater installs in place on
          # Windows; the WiX msi is still published for manual installs.
          updaterJsonPreferNsis: true

      # Apple Silicon refuses to start an app bundle that carries no signature
      # of its own — the only signature a freshly linked arm64 binary has is the
      # linker's, and Finder reports that app as damaged. An Intel build runs
      # under Rosetta, which does not enforce this, which is why the same
      # pipeline can look healthy on one DMG and broken on the other. The bundle
      # is ad-hoc signed (`signingIdentity: "-"`), and this step refuses to
      # publish one that is not.
      - name: Verify the macOS bundle is signed
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -euo pipefail
          app=$(find target -maxdepth 8 -type d -name 'Anvil.app' -path '*bundle/macos/*' | head -1)
          if [ -z "$app" ]; then
            echo "::error::no Anvil.app found under target/**/bundle/macos"
            exit 1
          fi
          echo "bundle: $app"
          codesign -dv --verbose=4 "$app" 2>&1 || true
          if [ ! -f "$app/Contents/_CodeSignature/CodeResources" ]; then
            echo "::error::$app has no bundle signature; Apple Silicon will report it as damaged"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"

  release:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The one thing a user never sees is the manifest, so a manifest that
      # silently lacks a platform would surface as "updates do not work on my
      # machine" weeks later. Refuse to publish that.
      - name: Check the updater manifest covers every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern latest.json --output latest.json --clobber
          cat latest.json
          for key in windows-x86_64 linux-x86_64 darwin-aarch64 darwin-x86_64; do
            if ! jq -e --arg k "$key" '.platforms | has($k)' latest.json > /dev/null; then
              echo "::error::latest.json is missing $key; in-app updates would skip that platform"
              exit 1
            fi
          done

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
