[package]
name = "anvil-catalog"
description = "Runtime registry, model catalog, skill and MCP inventory for Anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anvil-paths = { path = "../anvil-paths" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# Unpacking the Node archive a machine without an interpreter needs.
[target.'cfg(windows)'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
tar = "0.4"
flate2 = "1"

# The report doubles as the acceptance oracle, so its selector grammar is
# covered by unit tests instead of only by a live machine run.
[[example]]
name = "catalog_report"
test = true
