# App-level ACL for the Anvil host commands (R0-RS02).
#
# The main-window capability in `capabilities/main.json` is the only place that
# lists these permissions, so no other window (and no future external content
# webview) can call the host commands.
[[permission]]
identifier = "allow-get-preferences"
description = "Allows reading the persisted theme/language and the current system theme."
commands.allow = ["get_preferences"]

[[permission]]
identifier = "allow-set-preferences"
description = "Allows persisting the theme and/or language preference."
commands.allow = ["set_preferences"]

[[permission]]
identifier = "allow-log-event"
description = "Allows writing one diagnostic line to the host log (theme/i18n/layout probes)."
commands.allow = ["log_event"]


[[permission]]
identifier = "allow-catalog-snapshot"
description = "Allows reading the runtime registry, models, skills and MCP snapshot (runs the startup scan once)."
commands.allow = ["catalog_snapshot"]

[[permission]]
identifier = "allow-catalog-refresh"
description = "Allows re-scanning every adapter and re-syncing its resources."
commands.allow = ["catalog_refresh"]

[[permission]]
identifier = "allow-catalog-sync"
description = "Allows syncing one runtime's resources."
commands.allow = ["catalog_sync"]

[[permission]]
identifier = "allow-catalog-sync-inventory"
description = "Allows re-reading local skills, tools and MCP declarations without probing models."
commands.allow = ["catalog_sync_inventory"]

[[permission]]
identifier = "allow-catalog-add-model"
description = "Allows adding a custom model; the credential is encrypted with DPAPI before storage."
commands.allow = ["catalog_add_model"]

[[permission]]
identifier = "allow-catalog-verify-model"
description = "Allows verifying one model with a real request through its runtime."
commands.allow = ["catalog_verify_model"]

[[permission]]
identifier = "allow-catalog-set-default-model"
description = "Allows promoting a verified model to the default."
commands.allow = ["catalog_set_default_model"]

[[permission]]
identifier = "allow-catalog-set-model-enabled"
description = "Allows turning one catalog model on or off for the chat picker."
commands.allow = ["catalog_set_model_enabled"]

[[permission]]
identifier = "allow-catalog-mark-setup-done"
description = "Allows recording that first-run setup is finished, so the wizard stays closed."
commands.allow = ["catalog_mark_setup_done"]

[[permission]]
identifier = "allow-catalog-save-agent"
description = "Allows saving a runtime+model binding under a name."
commands.allow = ["catalog_save_agent"]

[[permission]]
identifier = "allow-catalog-delete-agent"
description = "Allows removing one saved agent binding."
commands.allow = ["catalog_delete_agent"]

[[permission]]
identifier = "allow-catalog-probe-mcp"
description = "Allows connecting to one declared MCP server and enumerating its tools."
commands.allow = ["catalog_probe_mcp"]

[[permission]]
identifier = "allow-runtime-install"
description = "Allows installing one runtime CLI (pi / codex / opencode / claude) through npm into the shared prefix."
commands.allow = ["runtime_install"]

[[permission]]
identifier = "allow-session-list"
description = "Allows listing chat sessions (pinned first, paging cursor, search)."
commands.allow = ["session_list"]

[[permission]]
identifier = "allow-session-detail"
description = "Allows reading one session with its messages and runs."
commands.allow = ["session_detail"]

[[permission]]
identifier = "allow-session-events"
description = "Allows reading the event ledger after a sequence number (the streaming poll)."
commands.allow = ["session_events"]

[[permission]]
identifier = "allow-session-open"
description = "Allows creating a session on one runtime; nothing is sent yet."
commands.allow = ["session_open"]

[[permission]]
identifier = "allow-session-send"
description = "Allows running one turn on a runtime and writing it to the ledger."
commands.allow = ["session_send"]

[[permission]]
identifier = "allow-session-abort"
description = "Allows asking the in-flight run to stop."
commands.allow = ["session_abort"]

[[permission]]
identifier = "allow-session-rename"
description = "Allows renaming a session."
commands.allow = ["session_rename"]

[[permission]]
identifier = "allow-session-pin"
description = "Allows pinning or unpinning a session in the history list."
commands.allow = ["session_pin"]

[[permission]]
identifier = "allow-session-archive"
description = "Allows archiving a session out of the default list, or restoring it."
commands.allow = ["session_archive"]

[[permission]]
identifier = "allow-session-delete"
description = "Allows deleting a session and everything derived from it."
commands.allow = ["session_delete"]

[[permission]]
identifier = "allow-session-projects"
description = "Allows listing the projects that group sessions in the history panel."
commands.allow = ["session_projects"]

[[permission]]
identifier = "allow-session-fork"
description = "Allows branching a session into a new session that carries the transcript up to a point."
commands.allow = ["session_fork"]

[[permission]]
identifier = "allow-session-approve"
description = "Allows answering one approval card raised by a waiting run."
commands.allow = ["session_approve"]

[[permission]]
identifier = "allow-session-context-list"
description = "Allows listing files and directories for the composer's @ references, confined to the project."
commands.allow = ["session_context_list"]

[[permission]]
identifier = "allow-session-export"
description = "Allows writing one conversation to the application's export folder as HTML, Markdown or JSON."
commands.allow = ["session_export"]

[[permission]]
identifier = "allow-agent-runs"
description = "Allows reading one agent's run records from the session ledger."
commands.allow = ["agent_runs"]

[[permission]]
identifier = "allow-session-rail"
description = "Allows reading the right rail: what a session executed, produced, cited and can preview."
commands.allow = ["session_rail"]

[[permission]]
identifier = "allow-session-compact"
description = "Allows folding the older part of a session's transcript into one summary row."
commands.allow = ["session_compact"]

[[permission]]
identifier = "allow-workspace-defaults"
description = "Allows reading (and creating on first use) the default workspace and projects root."
commands.allow = ["workspace_defaults"]

[[permission]]
identifier = "allow-workspace-ensure"
description = "Allows validating a directory the user picked and getting its canonical path."
commands.allow = ["workspace_ensure"]

[[permission]]
identifier = "allow-workspace-create"
description = "Allows creating one project folder under the projects root."
commands.allow = ["workspace_create"]

[[permission]]
identifier = "allow-workspace-pick"
description = "Allows opening the native folder picker."
commands.allow = ["workspace_pick"]

[[permission]]
identifier = "allow-workspace-pick-file"
description = "Allows opening the native file picker (its parent directory becomes the workspace)."
commands.allow = ["workspace_pick_file"]

[[permission]]
identifier = "allow-pi-subagent-status"
description = "Allows checking whether the installed pi ships and has activated the subagent extension."
commands.allow = ["pi_subagent_status"]

[[permission]]
identifier = "allow-pi-subagent-install"
description = "Allows copying pi's bundled subagent extension into the pi agent directory."
commands.allow = ["pi_subagent_install"]

[default]
description = "Default Anvil host command set: preferences, the diagnostic log line, the phase-1 catalog and the phase-2 chat sessions."
permissions = ["allow-get-preferences", "allow-set-preferences", "allow-log-event", "allow-catalog-snapshot", "allow-catalog-refresh", "allow-catalog-sync", "allow-catalog-sync-inventory", "allow-catalog-add-model", "allow-catalog-verify-model", "allow-catalog-set-default-model", "allow-catalog-probe-mcp", "allow-session-list", "allow-session-detail", "allow-session-events", "allow-session-open", "allow-session-send", "allow-session-abort", "allow-session-rename", "allow-session-pin", "allow-session-archive", "allow-session-delete", "allow-session-projects", "allow-session-fork", "allow-session-compact", "allow-session-approve", "allow-session-context-list", "allow-session-rail", "allow-session-export", "allow-agent-runs", "allow-workspace-defaults", "allow-workspace-ensure", "allow-workspace-create", "allow-workspace-pick", "allow-workspace-pick-file", "allow-pi-subagent-status", "allow-pi-subagent-install", "allow-runtime-install"]