# App-level ACL for the Anvil host commands (R0-RS02).
#
# The main-window capability in `capabilities/main.json` is the only place that
# lists these permissions, so no other window (and no future external content
# webview) can call the host commands.
[[permission]]
identifier = "allow-get-preferences"
description = "Allows reading the persisted theme/language and the current system theme."
commands.allow = ["get_preferences"]

[[permission]]
identifier = "allow-set-preferences"
description = "Allows persisting the theme and/or language preference."
commands.allow = ["set_preferences"]

[[permission]]
identifier = "allow-log-event"
description = "Allows writing one diagnostic line to the host log (theme/i18n/layout probes)."
commands.allow = ["log_event"]


[[permission]]
identifier = "allow-catalog-snapshot"
description = "Allows reading the runtime registry, models, skills and MCP snapshot (runs the startup scan once)."
commands.allow = ["catalog_snapshot"]

[[permission]]
identifier = "allow-catalog-refresh"
description = "Allows re-scanning every adapter and re-syncing its resources."
commands.allow = ["catalog_refresh"]

[[permission]]
identifier = "allow-catalog-sync"
description = "Allows syncing one runtime's resources."
commands.allow = ["catalog_sync"]

[[permission]]
identifier = "allow-catalog-add-model"
description = "Allows adding a custom model; the credential is encrypted with DPAPI before storage."
commands.allow = ["catalog_add_model"]

[[permission]]
identifier = "allow-catalog-verify-model"
description = "Allows verifying one model with a real request through its runtime."
commands.allow = ["catalog_verify_model"]

[[permission]]
identifier = "allow-catalog-set-default-model"
description = "Allows promoting a verified model to the default."
commands.allow = ["catalog_set_default_model"]

[[permission]]
identifier = "allow-catalog-probe-mcp"
description = "Allows connecting to one declared MCP server and enumerating its tools."
commands.allow = ["catalog_probe_mcp"]

[default]
description = "Default Anvil host command set: preferences, the diagnostic log line and the phase-1 catalog."
permissions = ["allow-get-preferences", "allow-set-preferences", "allow-log-event", "allow-catalog-snapshot", "allow-catalog-refresh", "allow-catalog-sync", "allow-catalog-add-model", "allow-catalog-verify-model", "allow-catalog-set-default-model", "allow-catalog-probe-mcp"]
