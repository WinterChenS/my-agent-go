[package]
name = "anvil"
description = "Anvil desktop host (Tauri v2) carrying the existing React frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "anvil"
path = "src/lib.rs"

[[bin]]
name = "anvil"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
# Screenshots of the browser pane: the WebView2 COM interface has to come from
# the exact version Tauri links, or the types are not the same types.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
] }

[dependencies]
anvil-catalog = { path = "../crates/anvil-catalog" }
anvil-paths = { path = "../crates/anvil-paths" }
anvil-session = { path = "../crates/anvil-session" }
# The workbench view reads ledger rows through `Store::raw()`. Same version as
# the crates that own the schema, so the workspace links one SQLite.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
# The native folder/file dialogs: the macOS picker is an NSOpenPanel the
# plugin owns, which no shell script can give us (see `workspace::run_picker`).
tauri-plugin-dialog = "2"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    # The folder picker: `SHBrowseForFolderW` and the COM allocator it returns.
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    # The file picker: `GetOpenFileNameW` from comdlg32.
    "Win32_UI_Controls_Dialogs",
    # The startup failure dialog: a desktop app has no console to read.
    "Win32_UI_WindowsAndMessaging",
] }

# macOS only. A child webview is created with `NSViewMinYMargin`, which makes
# AppKit move it on its own whenever the window resizes — after the page has
# already told us where the pane is. `browser::pin_view` clears that mask so the
# pane's rect is the only thing that decides the frame, and re-adds the view so
# a theme switch cannot bury it under the app's own webview.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# `NSUserDefaults` for the macOS app theme (`system_theme::system_dark`).
objc2-foundation = "0.3"
