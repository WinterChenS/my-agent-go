[package]
name = "anvil-devtools"
description = "Anvil verification and gate CLI (Rust replacement for cmd/devtools)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "anvil-devtools"
path = "src/main.rs"

[lib]
name = "anvil_devtools"
path = "src/lib.rs"

[dependencies]
anvil-paths = { path = "../../crates/anvil-paths" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Registry reads and synthetic key input are Windows-only; the evidence tool
# has to build on macOS and Linux as well, where `bundle-pi` stages those
# targets and `gate`/`verify` still record what machine ran.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
